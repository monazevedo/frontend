
<div class="avatar-container">
  <img [src]="localUserComponentFilho()?.photoURL ?? '/img/avatar.png' " alt="Imagem do avatar" class="avatar" />
  <!-- property bind, interpolação -->
  <span class="name">{{ localUserComponentFilho()?.displayName }}</span>
  <!-- evento de click -->
  <button (click)="logout()">SignOut</button>
  <!-- <button (mouseover)="logout()">Test</button> -->
</div>
